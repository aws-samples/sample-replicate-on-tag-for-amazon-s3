AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Automatic replication after tagging for Amazon S3 — provisions the Lambda
  function, EventBridge Scheduler schedule, State_Bucket, Athena workgroup, and
  least-privilege IAM roles.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required
        Parameters:
          - CodeLocation
          - SourceBucketNames
      - Label:
          default: Recommended — observability
        Parameters:
          - MetricsNamespace
          - MetricsDeploymentId
          - AlarmEmail
          - CompletionNotificationEmail
      - Label:
          default: Processing
        Parameters:
          - CheckFrequencyMinutes
          - LifecycleExpirationDays
          - JournalLookbackSeconds
      - Label:
          default: Scale and performance
        Parameters:
          - LambdaMemoryMB
          - LambdaTimeoutSeconds
          - JournalReadRowCap
          - ReinvocationChainLimit
          - CompletionCheckMemoryMB
      - Label:
          default: Resilience
        Parameters:
          - MaxBatchJobFailures
          - MaxConcurrentJobsPerBucket
      - Label:
          default: Encryption
        Parameters:
          - KmsKeyArn
          - JournalKmsKeyArn
          - SnsKmsKeyArn
      - Label:
          default: Networking (VPC)
        Parameters:
          - VpcId
          - SubnetIds
          - SecurityGroupIds
      - Label:
          default: Lake Formation
        Parameters:
          - LFAdminRoleArn

# Parameters — full descriptions live in deploy/README.md (Parameter Reference).
Parameters:
  CodeLocation:
    Type: String
    Description: S3 URI of the Lambda code package zip (see deploy/README.md).
    AllowedPattern: "^s3://[a-z0-9.-]{3,63}/.+\\.zip$"
    ConstraintDescription: Must be an s3:// URI to a .zip object.

  SourceBucketNames:
    Type: CommaDelimitedList
    Description: Comma-separated source S3 bucket names monitored by the Solution.
    # Without this, a blank value is accepted: CloudFormation passes an empty
    # string for a CommaDelimitedList as a single-element list containing "",
    # which reaches ExecutionRole as the malformed ARN "arn:aws:s3:::" and the
    # granters as an empty bucket name, failing after resources are created with
    # a message that does not name the real mistake. AllowedPattern on a
    # CommaDelimitedList is matched against every element, so an empty element
    # is rejected at submit time (parameters-section-structure.html).
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: >-
      SourceBucketNames must list at least one bucket, and each name must be a
      valid S3 bucket name: 3-63 characters, lowercase letters, numbers, dots
      and hyphens, beginning and ending with a letter or number.

  CheckFrequencyMinutes:
    Type: Number
    Default: 15
    MinValue: 15
    MaxValue: 1440
    Description: How often the Solution runs, in minutes (see deploy/README.md).

  LifecycleExpirationDays:
    Type: Number
    Default: 30
    Description: Days before manifest/Athena/completion-report objects expire.

  KmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) Customer-managed KMS key ARN for state objects and Athena
      results (see deploy/README.md KMS Key Setup).

  SnsKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) Customer-managed KMS key ARN for server-side encryption of the
      completion-report and batch-job-failure SNS topics. Leave empty for
      unencrypted topics. SNS has no keyless SSE option, so encryption requires
      a key. The key's own key policy must allow sns.amazonaws.com to call
      kms:Decrypt and kms:GenerateDataKey, or every publish fails — see
      deploy/README.md SNS Topic Encryption.

  JournalKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) Customer-managed KMS key ARN for the S3 Metadata journal
      (see deploy/README.md KMS Key Setup).

  LambdaTimeoutSeconds:
    Type: Number
    Default: 900
    MaxValue: 900
    Description: Lambda function timeout in seconds (max 900).

  LambdaMemoryMB:
    Type: Number
    Default: 2048
    AllowedValues: [1024, 2048, 3072, 4096, 6144, 8192, 10240]
    Description: ReplicationLambda memory in MiB (see deploy/README.md).

  CompletionCheckMemoryMB:
    Type: Number
    Default: 256
    AllowedValues: [128, 256, 512, 1024, 2048]
    Description: CompletionReportCheckLambda memory in MiB (see deploy/README.md).

  VpcId:
    Type: String
    Default: ""
    Description: >-
      (Optional) VPC ID for the Lambda. Requires SubnetIds/SecurityGroupIds
      (see deploy/README.md).

  SubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: (Required when VpcId is set) Subnet IDs for the Lambda.

  SecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: (Required when VpcId is set) Security group IDs for the Lambda.

  JournalLookbackSeconds:
    Type: Number
    Default: 7200
    MinValue: 0
    Description: Seconds to re-scan the journal watermark (see deploy/README.md).

  MetricsNamespace:
    Type: String
    Default: ""
    Description: (Optional) CloudWatch metrics namespace; empty disables metrics.

  MetricsDeploymentId:
    Type: String
    Default: ""
    Description: (Optional) Deployment dimension label on published metrics.

  JournalReadRowCap:
    Type: Number
    Default: 500000
    # Minimum 2, not 1: at 1 the JournalLookbackSeconds re-scan window gets a
    # share of zero, leaving no read window that is both memory-bounded and
    # lossless. See MIN_JOURNAL_READ_ROW_CAP in src/core/manifest_strategy.py.
    MinValue: 2
    Description: >-
      (Optional) Max journal rows read in one interval, covering the
      JournalLookbackSeconds re-scan window and the new rows above it
      together. At least 20 percent is reserved for new rows, so a
      single-interval tagging burst above this drains in bounded partial
      reads across a bounded number of intervals instead of risking the
      Lambda timeout (see deploy/README.md).

  MaxBatchJobFailures:
    Type: Number
    Default: 4
    MinValue: 1
    Description: >-
      Consecutive job failures before disabling a bucket
      (see deploy/README.md).

  MaxConcurrentJobsPerBucket:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: >-
      (Optional) Max Batch Operations jobs outstanding at once per source
      bucket. At the limit the bucket is skipped until a job finishes. 1
      serializes the bucket (see deploy/README.md).

  ReinvocationChainLimit:
    Type: Number
    Default: 20
    MinValue: 0
    Description: >-
      (Optional) Max consecutive self-reinvocations draining a capped run's
      backlog before deferring to the next scheduled trigger
      (see deploy/README.md).

  LFAdminRoleArn:
    Type: String
    Default: ""
    Description: (Optional) Existing LF admin role ARN (see deploy/README.md LF Mode).

  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      (Optional) Email for batch job failure alerts; requires CloudTrail
      (see deploy/README.md Prerequisites).

  CompletionNotificationEmail:
    Type: String
    Default: ""
    Description: >-
      (Optional) Email for report-derived per-object replication outcomes.
      The completion report CSV is always written; this parameter gates SNS
      email reports and report-missing alerts (see deploy/README.md Completion
      Tracking).

# Conditions
Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, ""]]
  HasSnsKmsKey: !Not [!Equals [!Ref SnsKmsKeyArn, ""]]
  HasJournalKmsKey: !Not [!Equals [!Ref JournalKmsKeyArn, ""]]
  HasMetricsNamespace: !Not [!Equals [!Ref MetricsNamespace, ""]]
  HasMetricsDeploymentId: !Not [!Equals [!Ref MetricsDeploymentId, ""]]
  HasVpc: !Not [!Equals [!Ref VpcId, ""]]
  HasLFAdminRole: !Not [!Equals [!Ref LFAdminRoleArn, ""]]
  CreateOwnLFAdmin: !Not [Condition: HasLFAdminRole]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasCompletionNotificationEmail: !Not [!Equals [!Ref CompletionNotificationEmail, ""]]

# Resources
Resources:

  # State_Bucket
  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketNamePrefix: !Sub "${AWS::StackName}-solution"
      BucketNamespace: account-regional
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-manifests
            Status: Enabled
            Prefix: "manifests/"
            ExpirationInDays: !Ref LifecycleExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-athena-results
            Status: Enabled
            Prefix: "athena-results/"
            ExpirationInDays: !Ref LifecycleExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-completion-reports
            Status: Enabled
            Prefix: "completion-reports/"
            ExpirationInDays: !Ref LifecycleExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Athena WorkGroup
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}-workgroup"
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${StateBucket}/athena-results/"
          EncryptionConfiguration: !If
            - HasKmsKey
            - EncryptionOption: SSE_KMS
              KmsKey: !Ref KmsKeyArn
            - EncryptionOption: SSE_S3

  # Execution Role
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: !If
        - HasVpc
        - - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref "AWS::NoValue"
      Policies:
        - PolicyName: ReplicationSolutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSourceBucketReplicationConfig
                Effect: Allow
                Action:
                  - s3:GetReplicationConfiguration
                Resource: !Split
                  - ","
                  - !Sub
                    - "arn:aws:s3:::${B}"
                    - B: !Join [",arn:aws:s3:::", !Ref SourceBucketNames]

              - Sid: AthenaJournalQuery
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetDataCatalog
                Resource:
                  - !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"
                  - !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/s3tablescatalog"

              # Scoped to the AWS-managed "aws-s3" S3 Tables bucket that every S3
              # Metadata journal lives in, per the AWS Service Authorization
              # Reference (list_s3tables.html): every action here accepts a
              # TableBucket or Table resource — none genuinely requires "*"
              # (security-scan-remediation Requirement 9.1, Decision 6). The
              # Table ARN has no namespace segment (namespace is a resource
              # attribute filtered by the s3tables:namespace condition key,
              # not part of the ARN path), so this is bucket-scoped rather
              # than scoped to each SourceBucketNames entry's own
              # b_<bucket> namespace.
              - Sid: S3TablesJournalRead
                Effect: Allow
                Action:
                  - s3tables:GetTableBucket
                  - s3tables:GetNamespace
                  - s3tables:ListNamespaces
                  - s3tables:GetTable
                  - s3tables:ListTables
                  - s3tables:GetTableMetadataLocation
                  - s3tables:GetTableData
                Resource:
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/aws-s3"
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/aws-s3/table/*"

              # lakeformation:GetDataAccess has no resource-level ARN at all —
              # confirmed against the AWS Service Authorization Reference
              # (list_lakeformation.html): "AWS Lake Formation does not
              # support specifying a resource ARN in the Resource element of
              # an IAM policy statement", for every action in the service.
              # Kept on its own statement so the s3tables scoping above is
              # never diluted by an action that has no ARN to scope.
              - Sid: LakeFormationDataAccess
                Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                Resource: "*"

              # Athena resolves s3tablescatalog/aws-s3 (federated) through Glue.
              # Scoped to the federated s3tablescatalog catalog and the aws-s3
              # table bucket's databases/tables, per the AWS Lake Formation
              # IAM-to-LF migration guide's documented federated ARN shapes
              # (change-access-lf-to-iam.html) — the "does not match standard
              # Glue ARN patterns" comment this replaces was describing the
              # documented federated shape itself, not an exception to it
              # (security-scan-remediation Requirement 9.2, Decision 6).
              # GetCatalogs additionally needs the bare account-root catalog
              # ARN (rootcatalog) to enumerate catalogs — a single fixed
              # resource per account, not a wildcard.
              - Sid: GlueFederatedS3TablesCatalog
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                  - glue:GetCatalog
                  - glue:GetCatalogs
                  - glue:SearchTables
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog/aws-s3"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/s3tablescatalog/aws-s3/*"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/s3tablescatalog/aws-s3/*"

              - Sid: ScratchBucketReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketAcl
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                  - s3:ListBucketMultipartUploads
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub "${StateBucket.Arn}/*"

              - Sid: S3BatchOperationsCreateJob
                Effect: Allow
                Action:
                  - s3:CreateJob
                  - s3:PutJobTagging
                  - s3:DescribeJob
                Resource:
                  - !Sub "arn:aws:s3:${AWS::Region}:${AWS::AccountId}:job/*"

              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*"

  # S3 Batch Operations job role (solution-owned).
  #
  # This is the role passed as create_job's RoleArn. It is a different role
  # from each source bucket's replication configuration role: this one only
  # initiates replication and reads the manifest, while the bucket's own
  # replication role performs the delivery. See
  # .kiro/specs/solution-owned-batchops-role/requirements.md.
  BatchOperationsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batchoperations.s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BatchReplicationJobPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InitiateReplicationOnSourceBuckets
                Effect: Allow
                Action: s3:InitiateReplication
                Resource: !Split
                  - ","
                  - !Sub
                    - "arn:aws:s3:::${B}/*"
                    - B: !Join ["/*,arn:aws:s3:::", !Ref SourceBucketNames]

              # s3:GetObjectVersion is deliberately absent: the manifest is
              # referenced by ObjectArn and ETag with no version id, so the
              # read is authorized against s3:GetObject even when the operator
              # enables the State_Bucket versioning hardening option. One
              # grant covers both parts of the inventory manifest -- the
              # manifest.json envelope and the data/ CSV files it references
              # both sit under manifests/<config-id>/.
              - Sid: ReadManifest
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${StateBucket.Arn}/manifests/*"

              - Sid: WriteCompletionReport
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${StateBucket.Arn}/completion-reports/*"

  # iam:PassRole for the job role above, as a standalone policy so that neither
  # role depends on the other: folding this statement into ExecutionRole's own
  # Policies block would make ExecutionRole depend on BatchOperationsRole.
  #
  # iam:PassedToService is deliberately absent -- s3control:CreateJob does not
  # populate that context key, so a statement carrying it always denies. See
  # .holmes/accepted-risks.md AR8.
  PassBatchOperationsRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PassBatchOperationsRole
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PassBatchOperationsRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt BatchOperationsRole.Arn

  # Lets the job role decrypt an SSE-KMS manifest. A separate policy so the
  # role itself stays unconditional.
  BatchOperationsRoleKmsPolicy:
    Type: AWS::IAM::Policy
    Condition: HasKmsKey
    Properties:
      PolicyName: BatchOperationsRoleKmsAccess
      Roles:
        - !Ref BatchOperationsRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DecryptManifest
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: !Ref KmsKeyArn

  # KMS Key Policy (conditional)
  KmsKeyPolicy:
    Type: AWS::IAM::Policy
    Condition: HasKmsKey
    Properties:
      PolicyName: KmsKeyAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OptionalCustomerManagedKmsKey
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref KmsKeyArn

  # SNS KMS Key Policy (conditional) — lets the Lambda publish to an encrypted
  # topic. Publishing to an SSE-enabled topic requires the publisher to hold
  # kms:GenerateDataKey and kms:Decrypt on the topic's key, in addition to the
  # key's own key policy allowing sns.amazonaws.com (which is the deploying
  # account's responsibility — see deploy/README.md SNS Topic Encryption).
  SnsKmsKeyPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSnsKmsKey
    Properties:
      PolicyName: SnsKmsKeyAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishToEncryptedSnsTopics
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref SnsKmsKeyArn

  # Journal KMS Key Policy (conditional)
  KmsJournalKeyPolicy:
    Type: AWS::IAM::Policy
    Condition: HasJournalKmsKey
    Properties:
      PolicyName: KmsJournalKeyAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: JournalTableKmsKey
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref JournalKmsKeyArn

  # Metrics Policy (conditional)
  MetricsPolicy:
    Type: AWS::IAM::Policy
    Condition: HasMetricsNamespace
    Properties:
      PolicyName: MetricsAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OptionalCloudWatchMetrics
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: !Ref MetricsNamespace

  # Completion Report Topic (conditional)
  # Report bodies carry object keys and version IDs (see README "Completion
  # Reporting"), so this topic is the one that most warrants encryption when the
  # deployment supplies a key.
  CompletionReportTopic:
    Type: AWS::SNS::Topic
    Condition: HasCompletionNotificationEmail
    Properties:
      KmsMasterKeyId: !If [HasSnsKmsKey, !Ref SnsKmsKeyArn, !Ref "AWS::NoValue"]

  CompletionReportSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasCompletionNotificationEmail
    Properties:
      TopicArn: !Ref CompletionReportTopic
      Protocol: email
      Endpoint: !Ref CompletionNotificationEmail

  # Completion Report Policy (conditional)
  CompletionReportPolicy:
    Type: AWS::IAM::Policy
    Condition: HasCompletionNotificationEmail
    Properties:
      PolicyName: CompletionReportAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishCompletionReport
            Effect: Allow
            Action:
              - sns:Publish
            Resource:
              - !Ref CompletionReportTopic

  # Grants sns:Publish on BatchJobFailureTopic for the report-missing alert
  # and the bucket-disabled alert (recovery-instructions email on
  # circuit-breaker / InlineHashCeiling disable). Scoped to HasAlarmEmail
  # alone (not also HasCompletionNotificationEmail) since ReplicationLambda's
  # disable path needs this regardless of whether completion tracking is
  # configured, and BatchJobFailureTopic itself only exists under
  # HasAlarmEmail.
  BatchJobFailureAlertPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAlarmEmail
    Properties:
      PolicyName: BatchJobFailureAlertAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishBatchJobFailureAlert
            Effect: Allow
            Action:
              - sns:Publish
            Resource:
              - !Ref BatchJobFailureTopic

  # Grants log-write access to BatchJobFailureLogGroup, unconditionally —
  # both check_report_handler's report-missing alert and the
  # ReplicationLambda's bucket-disabled alert always write this log group
  # regardless of whether AlarmEmail (SNS) is configured, mirroring
  # Requirement 8.4's "alert is visible even when AlarmEmail is not
  # configured" guarantee. BatchJobFailureLogGroup itself is created
  # unconditionally (no Condition on that resource), so this permission
  # must not be gated either.
  BatchJobFailureLogWritePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BatchJobFailureLogWriteAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WriteBatchJobFailureLogGroup
            Effect: Allow
            Action:
              - logs:PutLogEvents
              - logs:CreateLogStream
            Resource:
              - !GetAtt BatchJobFailureLogGroup.Arn

  # LFGranterRole
  LFGranterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LFGranterPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # lakeformation:GetDataLakeSettings/PutDataLakeSettings/
              # GrantPermissions/RevokePermissions/GetDataAccess genuinely have no
              # resource-level ARN — confirmed against the AWS Service
              # Authorization Reference (list_lakeformation.html): "AWS Lake
              # Formation does not support specifying a resource ARN in the
              # Resource element of an IAM policy statement", for every
              # action in the service. glue:GetCatalog and the s3tables
              # actions below DO have resource-level ARNs and are scoped to
              # them (security-scan-remediation Requirement 9.4, Decision 6);
              # the original comment claiming otherwise for all of these was
              # incorrect. sts:AssumeRole is kept in a separate, scoped
              # statement below so it is never on Resource: "*".
              - Sid: LFOperations
                Effect: Allow
                Action:
                  - lakeformation:GetDataLakeSettings
                  - lakeformation:PutDataLakeSettings
                  - lakeformation:GrantPermissions
                  - lakeformation:RevokePermissions
                  - lakeformation:GetDataAccess
                Resource: "*"
              # GetCatalog on a nested federated catalog id
              # ("<account>:s3tablescatalog/aws-s3") is authorized by Glue
              # against the bare account-root catalog ARN, not only against the
              # child catalog ARNs — the observed AccessDeniedException names
              # "arn:aws:glue:<region>:<account>:catalog" as the resource. The
              # root ARN is a single fixed resource per account, not a
              # wildcard. ExecutionRole's GlueFederatedS3TablesCatalog
              # statement already includes it for the same reason.
              #
              # GetDatabase and GetTable are required to issue the grants, not
              # to read data. Every principal that grants or revokes Lake
              # Formation permissions by the named-resource method needs
              # glue:GetDatabase on the database, or glue:GetTable on the table,
              # that the grant names -- data lake administrators included, so
              # the LFAdminGranterSetup admin registration does not substitute
              # for them (required-permissions-for-grant.html). Without them
              # GrantPermissions fails with "Insufficient Glue permissions to
              # access database b_<bucket>". The granter grants on a Database
              # resource and a Table resource per source bucket, and revokes the
              # same two on stack delete, so both actions are needed. Scoped by
              # wildcard within the single AWS-managed aws-s3 table bucket,
              # matching the ARN shapes ExecutionRole already uses.
              - Sid: LFGranterGlueCatalog
                Effect: Allow
                Action:
                  - glue:GetCatalog
                  - glue:GetDatabase
                  - glue:GetTable
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog/aws-s3"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/s3tablescatalog/aws-s3/*"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/s3tablescatalog/aws-s3/*"
              # glue:GetCatalog on the federated s3tablescatalog/aws-s3
              # catalog is authorized by Glue only after Glue itself calls the
              # S3 Tables federation source as this principal — observed
              # directly in a fresh IAM-mode account: GetCatalog fails with
              # "AccessDeniedException ... From federation source ... is not
              # authorized to perform: s3tables:GetTableBucket", naming this
              # role, not a Lake-Formation-vended identity. The previous
              # comment's premise (credential vending makes S3 Tables IAM
              # permissions unnecessary for the caller) does not hold for this
              # call in IAM mode, so mode-detection — which every deploy
              # performs, LF mode or not — fails without this grant. Scoped
              # to the single AWS-managed aws-s3 table bucket, matching the
              # ARN shapes ExecutionRole's S3TablesJournalRead statement uses.
              - Sid: LFGranterS3TablesRead
                Effect: Allow
                Action:
                  - s3tables:GetTableBucket
                  - s3tables:GetNamespace
                  - s3tables:ListNamespaces
                  - s3tables:GetTable
                  - s3tables:ListTables
                  - s3tables:GetTableMetadataLocation
                  - s3tables:GetTableData
                Resource:
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/aws-s3"
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/aws-s3/table/*"
              - Sid: AssumeLFAdminRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                # Scoped to LFAdminRoleArn when set; otherwise a dummy ARN
                # (CreateOwnLFAdmin path), so this is never Resource: "*".
                Resource: !If
                  - HasLFAdminRole
                  - !Ref LFAdminRoleArn
                  - "arn:aws:iam::000000000000:role/NoLFAdminRoleConfigured"
              - Sid: LFGranterLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*"

  # LFAdminGranterFunction (Condition: CreateOwnLFAdmin)
  LFAdminGranterFunction:
    Type: AWS::Lambda::Function
    Condition: CreateOwnLFAdmin
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LFGranterRole.Arn
      Timeout: 300
      Architectures: [arm64]
      Environment:
        Variables:
          # Privileged parameters are supplied by the template, not by the
          # invoking event, so a caller able to invoke this function cannot
          # choose which principal becomes a data lake administrator.
          PRINCIPAL_ARN: !GetAtt LFGranterRole.Arn
          STACK_ID: !Ref AWS::StackId
          # Catalog id for the mode check below.
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import boto3
          import random
          import time
          import cfnresponse

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          lf = boto3.client("lakeformation")
          glue = boto3.client("glue")


          # detect_mode is duplicated from LFPermissionsGranterFunction rather
          # than shared. CloudFormation inline ZipFile code cannot be imported
          # across two functions; sharing it would mean a Lambda layer or an S3
          # artifact, and the Solution's one-template, no-prebuilt-asset
          # deployment shape is worth more than de-duplicating twenty lines.
          # The two copies are read-only against the same Glue API and are
          # expected to agree; if one changes, change both.
          def detect_mode():
              # Never assume a mode when GetCatalog fails. Raising fails the
              # resource, which matches LFPermissionsGranterFunction and adds
              # no new failure mode: that function performs the same check on
              # every deploy and already fails the stack when it cannot
              # determine the mode.
              account_id = os.environ["ACCOUNT_ID"]
              last_exc = None
              for attempt in range(5):
                  try:
                      cat = glue.get_catalog(
                          CatalogId=f"{account_id}:s3tablescatalog/aws-s3"
                      )
                      principals = [
                          p["Principal"]["DataLakePrincipalIdentifier"]
                          for p in cat["Catalog"].get("CreateTableDefaultPermissions", [])
                      ]
                      return "IAM" if "IAM_ALLOWED_PRINCIPALS" in principals else "LF"
                  except Exception as exc:
                      last_exc = exc
                      logger.warning("GetCatalog attempt %d failed: %s", attempt + 1, exc)
                      if attempt < 4:
                          time.sleep(2 ** attempt)
              raise RuntimeError(
                  "Cannot determine whether %s:s3tablescatalog/aws-s3 is in IAM or "
                  "LF mode; last GetCatalog error: %s" % (account_id, last_exc)
              )


          def put_with_retry(new_settings, max_attempts=10):
              for attempt in range(max_attempts):
                  try:
                      lf.put_data_lake_settings(**new_settings)
                      return
                  except lf.exceptions.ConcurrentModificationException:
                      if attempt == max_attempts - 1:
                          raise
                      time.sleep(2 ** attempt + random.uniform(0, 1))


          def append_admin(principal_arn):
              response = lf.get_data_lake_settings()
              settings = response["DataLakeSettings"]
              admins = settings.get("DataLakeAdmins", [])
              if not any(
                  a.get("DataLakePrincipalIdentifier") == principal_arn for a in admins
              ):
                  admins.append({"DataLakePrincipalIdentifier": principal_arn})
              settings["DataLakeAdmins"] = admins
              logger.info("Adding %s as data lake admin", principal_arn)
              put_with_retry({"DataLakeSettings": settings})


          def remove_admin(principal_arn):
              response = lf.get_data_lake_settings()
              settings = response["DataLakeSettings"]
              admins = settings.get("DataLakeAdmins", [])
              remaining = [
                  a for a in admins
                  if a.get("DataLakePrincipalIdentifier") != principal_arn
              ]
              if len(remaining) == len(admins):
                  # Nothing to remove, so no settings write. The Delete branch
                  # is deliberately not gated on catalog mode -- an admin
                  # registered while the catalog was in LF mode must stay
                  # removable even if the mode has since changed -- and this
                  # keeps an IAM-mode stack from rewriting account-wide
                  # DataLakeSettings on delete when it registered nothing.
                  logger.info("%s is not a data lake admin; nothing to remove", principal_arn)
                  return
              settings["DataLakeAdmins"] = remaining
              logger.info("Removing %s from data lake admins", principal_arn)
              put_with_retry({"DataLakeSettings": settings})


          def handler(event, context):
              try:
                  # Defence in depth behind the environment reads below: an
                  # invocation that did not come from this stack's own
                  # CloudFormation operations is rejected before any mutation.
                  # The response reason is deliberately non-specific so a
                  # caller probing the function learns nothing about the
                  # expected value.
                  if event.get("StackId") != os.environ["STACK_ID"]:
                      logger.error("LFAdminGranter: request rejected")
                      cfnresponse.send(
                          event, context, cfnresponse.FAILED,
                          {"Error": "Request rejected"},
                      )
                      return
                  # PRINCIPAL_ARN comes from the environment, never from
                  # event["ResourceProperties"], which an in-account caller
                  # holding lambda:InvokeFunction controls.
                  principal_arn = os.environ["PRINCIPAL_ARN"]
                  request_type = event.get("RequestType")
                  logger.info("LFAdminGranter: %s principal=%s", request_type, principal_arn)
                  if request_type == "Create":
                      # An IAM-mode catalog -- the documented default -- needs
                      # no Lake Formation grants, so registering an
                      # account-wide data lake administrator for it buys
                      # nothing. LFPermissionsGranterFunction makes the same
                      # check and issues no grant in IAM mode.
                      mode = detect_mode()
                      logger.info("LFAdminGranter: catalog mode=%s", mode)
                      if mode == "IAM":
                          logger.info(
                              "LFAdminGranter: IAM mode, no admin registration needed"
                          )
                      else:
                          append_admin(principal_arn)
                  elif request_type == "Delete":
                      try:
                          remove_admin(principal_arn)
                      except Exception as exc:
                          # Judgement call, scan-aa27a832 Req 2.2: log at ERROR
                          # and still respond SUCCESS, rather than responding
                          # FAILED.
                          #
                          # Responding FAILED here puts the stack in
                          # DELETE_FAILED, which this template is already prone
                          # to for other reasons (the Athena workgroup and a
                          # non-empty State Bucket both block a plain delete),
                          # and it blocks the deletion of every other resource
                          # rather than just this one. The failure it would be
                          # reporting is also self-limiting: CloudFormation
                          # deletes LFGranterRole regardless, so a stale
                          # DataLakeAdmins entry names an ARN with no principal
                          # behind it, and the role's physical name carries a
                          # CloudFormation-generated suffix, so a later
                          # same-named role is implausible.
                          #
                          # What Req 2.2 asks for is that the entry cannot
                          # outlive the stack *unnoticed*. An ERROR naming the
                          # exact ARN left behind and the API call to remove it
                          # satisfies that: it is picked up by log-level alarms
                          # and metric filters, where the previous WARNING was
                          # not, and it hands the operator a one-command
                          # remediation instead of a wedged stack.
                          logger.error(
                              "LFAdminGranter: failed to remove %s from the "
                              "account's Lake Formation data lake "
                              "administrators: %s. Stack deletion continues, so "
                              "this entry may outlive the stack -- remove it by "
                              "hand with lakeformation:PutDataLakeSettings, or "
                              "confirm with 'aws lakeformation "
                              "get-data-lake-settings'.",
                              principal_arn,
                              exc,
                          )
                  cfnresponse.send(
                      event, context, cfnresponse.SUCCESS,
                      {"PrincipalArn": principal_arn},
                  )
              except Exception as exc:
                  logger.error("LFAdminGranter failed: %s", exc)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(exc)})

  # Log group for LFAdminGranterFunction; conditional matches the function.
  LFAdminGranterLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateOwnLFAdmin
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LFAdminGranterFunction}"
      RetentionInDays: 90

  # LFAdminGranterResource (Condition: CreateOwnLFAdmin)
  LFAdminGranterResource:
    Type: Custom::LFAdminGranter
    Condition: CreateOwnLFAdmin
    DependsOn: LFAdminGranterLogGroup
    Properties:
      ServiceToken: !GetAtt LFAdminGranterFunction.Arn
      PrincipalArn: !GetAtt LFGranterRole.Arn

  # LFPermissionsGranterFunction
  LFPermissionsGranterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LFGranterRole.Arn
      Timeout: 300
      Architectures: [arm64]
      Environment:
        Variables:
          # Privileged parameters are supplied by the template, not by the
          # invoking event, so a caller able to invoke this function cannot
          # choose which principal is granted Lake Formation access, over which
          # namespaces, or which role is assumed to issue the grant.
          #
          # Reconciling this with change detection (scan-aa27a832 Req 1.3):
          # CloudFormation sends ExecuteLFPermissionsGranter an Update only when
          # one of the custom resource's own properties changes, so
          # SourceBucketNames has to stay listed there -- adding a source bucket
          # must re-invoke this function or the new namespace never gets its
          # grants. The same holds for LFAdminRoleArn and ExecutionRoleArn.
          # Those properties are therefore retained as change triggers while the
          # handler reads only these variables. Both sides resolve from the same
          # template expressions, so they cannot disagree.
          PRINCIPAL_ARN: !GetAtt ExecutionRole.Arn
          SOURCE_BUCKET_NAMES: !Join [",", !Ref SourceBucketNames]
          LF_ADMIN_ROLE_ARN: !If [HasLFAdminRole, !Ref LFAdminRoleArn, ""]
          ACCOUNT_ID: !Ref AWS::AccountId
          STACK_ID: !Ref AWS::StackId
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import time
          import boto3
          import cfnresponse

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def get_clients(lf_admin_role_arn):
              # The mode check and the grants must run as the same principal.
              # A check made as the Lambda's own role can be denied while the
              # grant path (the LF admin role) is unaffected, so the two
              # clients are always built from one set of credentials.
              if lf_admin_role_arn:
                  logger.info("Assuming LF admin role: %s", lf_admin_role_arn)
                  sts = boto3.client("sts")
                  creds = sts.assume_role(
                      RoleArn=lf_admin_role_arn, RoleSessionName="LFGranter"
                  )["Credentials"]
                  kwargs = {
                      "aws_access_key_id": creds["AccessKeyId"],
                      "aws_secret_access_key": creds["SecretAccessKey"],
                      "aws_session_token": creds["SessionToken"],
                  }
              else:
                  kwargs = {}
              return (
                  boto3.client("lakeformation", **kwargs),
                  boto3.client("glue", **kwargs),
              )


          def detect_mode(glue, account_id):
              # Never assume a mode when GetCatalog fails. Defaulting to LF
              # turns a failed check into a failed grant; defaulting to IAM
              # would silently deploy an execution role that cannot read the
              # journal. Retry to absorb IAM propagation on a freshly created
              # role, then surface the real error.
              last_exc = None
              for attempt in range(5):
                  try:
                      cat = glue.get_catalog(
                          CatalogId=f"{account_id}:s3tablescatalog/aws-s3"
                      )
                      principals = [
                          p["Principal"]["DataLakePrincipalIdentifier"]
                          for p in cat["Catalog"].get("CreateTableDefaultPermissions", [])
                      ]
                      return "IAM" if "IAM_ALLOWED_PRINCIPALS" in principals else "LF"
                  except Exception as exc:
                      last_exc = exc
                      logger.warning("GetCatalog attempt %d failed: %s", attempt + 1, exc)
                      if attempt < 4:
                          time.sleep(2 ** attempt)
              raise RuntimeError(
                  "Cannot determine whether %s:s3tablescatalog/aws-s3 is in IAM or "
                  "LF mode; last GetCatalog error: %s" % (account_id, last_exc)
              )


          def handler(event, context):
              physical_id = event.get("PhysicalResourceId", "lf-grants")
              try:
                  # Defence in depth behind the environment reads below: an
                  # invocation that did not come from this stack's own
                  # CloudFormation operations is rejected before any grant or
                  # revocation. The response reason is deliberately
                  # non-specific so a caller probing the function learns
                  # nothing about the expected value.
                  if event.get("StackId") != os.environ["STACK_ID"]:
                      logger.error("LFPermissionsGranter: request rejected")
                      cfnresponse.send(
                          event, context, cfnresponse.FAILED,
                          {"Error": "Request rejected"}, physical_id,
                      )
                      return
                  # Every privileged value comes from the environment, never
                  # from event["ResourceProperties"], which an in-account
                  # caller holding lambda:InvokeFunction controls.
                  account_id = os.environ["ACCOUNT_ID"]
                  execution_role_arn = os.environ["PRINCIPAL_ARN"]
                  lf_admin_role_arn = os.environ["LF_ADMIN_ROLE_ARN"]
                  source_bucket_names = os.environ["SOURCE_BUCKET_NAMES"]
                  request_type = event.get("RequestType")
                  logger.info("LFPermissionsGranter: %s account=%s", request_type, account_id)
                  if request_type in ("Create", "Update"):
                      lf, glue = get_clients(lf_admin_role_arn)
                      mode = detect_mode(glue, account_id)
                      logger.info("LFPermissionsGranter: catalog mode=%s", mode)
                      if mode == "IAM":
                          logger.info("LFPermissionsGranter: IAM mode, no grants needed")
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                          return
                      grants = []
                      catalog_id = f"{account_id}:s3tablescatalog/aws-s3"
                      for bucket in source_bucket_names.split(","):
                          namespace = "b_" + bucket.strip().replace(".", "_")
                          lf.grant_permissions(
                              Principal={"DataLakePrincipalIdentifier": execution_role_arn},
                              Resource={"Database": {"CatalogId": catalog_id, "Name": namespace}},
                              Permissions=["DESCRIBE"],
                          )
                          lf.grant_permissions(
                              Principal={"DataLakePrincipalIdentifier": execution_role_arn},
                              Resource={
                                  "Table": {
                                      "CatalogId": catalog_id,
                                      "DatabaseName": namespace,
                                      "TableWildcard": {},
                                  }
                              },
                              Permissions=["SELECT", "DESCRIBE"],
                          )
                          grants.append(
                              {"principal": execution_role_arn, "catalog_id": catalog_id, "namespace": namespace}
                          )
                      physical_id = json.dumps({"grants": grants})
                      logger.info("LFPermissionsGranter: granted permissions for %d bucket(s)", len(grants))
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                  elif request_type == "Delete":
                      try:
                          # The revocation list is rebuilt from the environment
                          # rather than parsed out of event["PhysicalResourceId"],
                          # which an in-account caller controls. Parsing it there
                          # let a forged Delete name any principal, catalog and
                          # namespace in the account and have them revoked under
                          # the assumed Lake Formation admin role -- the one path
                          # where a forged event could reach beyond this stack's
                          # own resources (diff scan scan-f1927e8a, f-756c9994).
                          # It names the same grants the Create branch issued,
                          # since both read the same variables.
                          lf, _ = get_clients(lf_admin_role_arn)
                          catalog_id = f"{account_id}:s3tablescatalog/aws-s3"
                          for bucket in source_bucket_names.split(","):
                              namespace = "b_" + bucket.strip().replace(".", "_")
                              try:
                                  lf.revoke_permissions(
                                      Principal={"DataLakePrincipalIdentifier": execution_role_arn},
                                      Resource={
                                          "Database": {
                                              "CatalogId": catalog_id,
                                              "Name": namespace,
                                          }
                                      },
                                      Permissions=["DESCRIBE"],
                                  )
                              except Exception as exc:
                                  logger.warning("Revoke database DESCRIBE failed (best-effort): %s", exc)
                              try:
                                  lf.revoke_permissions(
                                      Principal={"DataLakePrincipalIdentifier": execution_role_arn},
                                      Resource={
                                          "Table": {
                                              "CatalogId": catalog_id,
                                              "DatabaseName": namespace,
                                              "TableWildcard": {},
                                          }
                                      },
                                      Permissions=["SELECT", "DESCRIBE"],
                                  )
                              except Exception as exc:
                                  logger.warning("Revoke table SELECT+DESCRIBE failed (best-effort): %s", exc)
                      except Exception as exc:
                          logger.warning("LFPermissionsGranter delete best-effort failed: %s", exc)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
              except Exception as exc:
                  logger.error("LFPermissionsGranter failed: %s", exc)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(exc)})

  # Log group for LFPermissionsGranterFunction; always created (no Condition).
  LFPermissionsGranterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LFPermissionsGranterFunction}"
      RetentionInDays: 90

  # ExecuteLFPermissionsGranter
  ExecuteLFPermissionsGranter:
    Type: Custom::LFPermissionsGranter
    DependsOn:
      - ExecutionRole
      - LFPermissionsGranterLogGroup
    Properties:
      ServiceToken: !GetAtt LFPermissionsGranterFunction.Arn
      # ExecutionRoleArn, SourceBucketNames, AccountId, and LFAdminRoleArn are
      # change-detection triggers only. The handler reads their values from its
      # environment instead -- see the Environment block on
      # LFPermissionsGranterFunction for why they appear in both places.
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      SourceBucketNames: !Join [",", !Ref SourceBucketNames]
      AccountId: !Ref AWS::AccountId
      LFAdminRoleArn: !If [HasLFAdminRole, !Ref LFAdminRoleArn, ""]
      # Implicit DependsOn LFAdminGranterResource via the !GetAtt reference below.
      LFAdminGranterDependency: !If
        - CreateOwnLFAdmin
        - !GetAtt LFAdminGranterResource.PrincipalArn
        - "n/a"

  # Config Custom Resource: writes Solution_Config to State_Bucket
  # (see .kiro/specs/.complete/console-deployment/design.md)
  # ConfigResourceRole
  ConfigResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConfigWriterPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteSolutionConfigObject
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${StateBucket.Arn}/config/solution-config.json"
              # Seeding a starting checkpoint needs PutObject only. DeleteObject
              # is deliberately not granted here: the handler never deletes a
              # state object, and deleting one rewinds that bucket to the start
              # of the journal, so the deploy-time role must not be able to.
              - Sid: SeedCheckpointObjects
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${StateBucket.Arn}/state/*"
              - Sid: ConfigResourceLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*"
              # kms:GenerateDataKey is required when the customer provides a KMS key
              # so that config writes can use SSE-KMS.  Omitted when KmsKeyArn is "".
              - !If
                - HasKmsKey
                - Sid: KmsForConfigWrite
                  Effect: Allow
                  Action:
                    - kms:GenerateDataKey
                    - kms:Decrypt
                    - kms:DescribeKey
                  Resource: !Ref KmsKeyArn
                - !Ref "AWS::NoValue"

  # ConfigResourceFunction
  ConfigResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ConfigResourceRole.Arn
      Timeout: 300
      Architectures: [arm64]
      Environment:
        Variables:
          # Privileged parameters are supplied by the template, not by the
          # invoking event, so a caller able to invoke this function cannot
          # choose which object is written or deleted. The Delete branch
          # removes config/solution-config.json, which halts every scheduled
          # run, so the target of that delete is the value most worth taking
          # out of the caller's hands.
          #
          # The config object's whole content is here too, so a forged event
          # can only reproduce what a legitimate deploy writes. Sourcing the
          # bucket list, Region, and interval from the event would let a caller
          # drop a bucket from monitoring -- silent non-replication -- or set a
          # degenerate interval, and the poisoned object outlives the call
          # (diff scan scan-972cfd4f, f-77d789f5).
          #
          # Reconciling this with change detection (scan-aa27a832 Req 1.3):
          # CloudFormation sends SolutionConfig an Update only when one of the
          # custom resource's own properties changes, so these values have to
          # stay listed there as change triggers -- moving them here alone
          # would leave the resource uninvoked when any of them changes. They
          # are therefore in both places, and the handler reads only these.
          # Both sides resolve from the same template expressions, so they
          # cannot disagree; the properties are a trigger, not an input.
          STATE_BUCKET: !Ref StateBucket
          CONFIG_KEY: config/solution-config.json
          SOURCE_BUCKET_NAMES: !Join [",", !Ref SourceBucketNames]
          REGION: !Ref AWS::Region
          CHECK_FREQUENCY_MINUTES: !Ref CheckFrequencyMinutes
          KMS_KEY_ARN: !If [HasKmsKey, !Ref KmsKeyArn, ""]
          STACK_ID: !Ref AWS::StackId
      Code:
        ZipFile: |
          """Config-writing custom resource handler (deploy/template.yaml ConfigResourceFunction).

          Source of truth for the inline Lambda Code.ZipFile; tests/test_template.py
          asserts they match and that this file is < 4096 bytes.

          CREATE/UPDATE: writes Solution_Config JSON to State_Bucket and seeds a
          checkpoint for each new source bucket. DELETE: removes config only.
          """
          import json
          import os
          from datetime import datetime, timezone

          import boto3
          import cfnresponse  # auto-provided for inline ZipFile Lambdas; do not bundle

          s3 = boto3.client("s3")


          def _interval_from_minutes(minutes):
              """Derive the processing_interval duration string from a check frequency
              expressed in minutes (e.g. 60 -> "1h", 30 -> "30m")."""
              n = int(minutes)
              if n % 60 == 0:
                  return f"{n // 60}h"
              return f"{n}m"


          def _seed_checkpoints(bucket, names, kms_key_arn):
              """Write an initial checkpoint for each bucket, skipping if one exists."""
              wm = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")
              for name in names:
                  body = json.dumps({
                      "source_bucket": name,
                      "last_processed_watermark": wm,
                      "lease": None,
                      "processed_window": [],
                  })
                  kw = {
                      "Bucket": bucket,
                      "Key": f"state/{name}.json",
                      "Body": body.encode("utf-8"),
                      "ContentType": "application/json",
                      "IfNoneMatch": "*",
                  }
                  if kms_key_arn:
                      kw["ServerSideEncryption"] = "aws:kms"
                      kw["SSEKMSKeyId"] = kms_key_arn
                  try:
                      s3.put_object(**kw)
                  except s3.exceptions.ClientError as e:
                      if e.response["Error"]["Code"] not in (
                          "PreconditionFailed", "ConditionalRequestConflict",
                      ):
                          raise


          def handler(event, context):
              # Every value written comes from the environment, not the event; see template.
              bucket = os.environ["STATE_BUCKET"]
              key = os.environ["CONFIG_KEY"]
              minutes = os.environ["CHECK_FREQUENCY_MINUTES"]
              try:
                  if event.get("StackId") != os.environ["STACK_ID"]:
                      cfnresponse.send(event, context, cfnresponse.FAILED,
                                       {"Error": "Request rejected"})
                      return
                  if event["RequestType"] == "Delete":
                      s3.delete_object(Bucket=bucket, Key=key)  # idempotent: 204 even if absent
                  else:  # Create or Update
                      region = os.environ["REGION"]
                      names = [n for n in os.environ["SOURCE_BUCKET_NAMES"].split(",") if n]
                      config = {
                          "buckets": [{"name": n, "region": region} for n in names],
                          "processing_interval": _interval_from_minutes(minutes),
                      }
                      put_kwargs = {
                          "Bucket": bucket,
                          "Key": key,
                          "Body": json.dumps(config).encode("utf-8"),
                          "ContentType": "application/json",
                      }
                      kms_key_arn = os.environ.get("KMS_KEY_ARN", "").strip()
                      if kms_key_arn:
                          put_kwargs["ServerSideEncryption"] = "aws:kms"
                          put_kwargs["SSEKMSKeyId"] = kms_key_arn
                      s3.put_object(**put_kwargs)
                      # Seed newly added buckets only; every seed write is conditional.
                      if event["RequestType"] == "Create":
                          to_seed = names
                      else:
                          old = set(event.get("OldResourceProperties", {}).get("Buckets", []))
                          to_seed = [n for n in names if n not in old]
                      if to_seed:
                          _seed_checkpoints(bucket, to_seed, kms_key_arn)
                  freq_seconds = str(int(minutes) * 60)
                  cfnresponse.send(
                      event, context, cfnresponse.SUCCESS,
                      {"CheckFrequencySeconds": freq_seconds},
                      physicalResourceId=key,
                  )
              except Exception as exc:  # signal failure so the stack fails fast (Req 7.6)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(exc)})
                  raise

  # Log group for ConfigResourceFunction.
  ConfigResourceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ConfigResourceFunction}"
      RetentionInDays: 90

  # SolutionConfig (Custom::SolutionConfig)
  SolutionConfig:
    Type: Custom::SolutionConfig
    DependsOn:
      - StateBucket
      - ConfigResourceLogGroup
    Properties:
      ServiceToken: !GetAtt ConfigResourceFunction.Arn
      # Every property below is a change-detection trigger only. The handler
      # reads all of them from its environment instead -- see the Environment
      # block on ConfigResourceFunction for why they appear in both places.
      # Buckets on an Update event is still read from here, and only narrows
      # which of the environment's bucket names are seeded; a seed write is
      # conditional on the state object not already existing.
      StateBucket: !Ref StateBucket
      ConfigKey: config/solution-config.json
      Buckets: !Ref SourceBucketNames
      Region: !Ref AWS::Region
      CheckFrequencyMinutes: !Ref CheckFrequencyMinutes
      KmsKeyArn: !If [HasKmsKey, !Ref KmsKeyArn, ""]
      # Forces re-invocation when the release changes. CloudFormation sends
      # this custom resource an Update only when one of its own properties
      # changes, so without this an update that replaced the handler's inline
      # code would leave it uninvoked: the response attributes this template
      # consumes (CheckFrequencySeconds, below) would keep their previous
      # values, and the config object would keep its previous shape.
      #
      # Bound to CodeLocation rather than a hand-bumped literal because a
      # literal only works if whoever edits the handler remembers to bump it,
      # and it has already been missed once. CodeLocation must change for every
      # release anyway (build-package.sh content-hashes the key, and an
      # unchanged value leaves the Lambda running the old code — see
      # "Upgrading" in README.md), so this fires on exactly the deploys where
      # the handler could have changed, and stays quiet on a parameter-only
      # update such as LambdaMemoryMB where nothing here depends on the change.
      #
      # Re-invocation is side-effect-safe: the handler rewrites the config
      # object from these properties, and seeds a state object only for a
      # bucket that has none (If-None-Match: *). It does not write the
      # per-bucket disabled flag, which lives in the state object, so a
      # re-invocation cannot clear a circuit-breaker disable.
      CodeHash: !Ref CodeLocation

  # Parses s3://bucket/key CodeLocation (robust for keys with prefixes,
  # which intrinsics can't extract) and checks the referenced zip has this
  # Solution's expected layout before the stack builds a Lambda around it.
  CodeLocationParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeLocationParserLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*"
        # Read-only, and scoped to the one bucket CodeLocation names rather
        # than to *. The bucket is extractable with intrinsics even though the
        # key is not: AllowedPattern on CodeLocation guarantees the value is
        # s3://<bucket>/<key>.zip, so element 2 of a "/" split is always the
        # bucket. Object-level scoping is deliberately not attempted here,
        # because reproducing the key parse in a static policy is the fragile
        # part, and a mis-parse would surface as an opaque AccessDenied.
        - PolicyName: CodeLocationParserReadPackage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "arn:aws:s3:::${CodeBucket}/*"
                  - CodeBucket: !Select [2, !Split ["/", !Ref CodeLocation]]

  # Two failure modes are treated differently on purpose.
  #
  # A zip that is readable and demonstrably wrong fails the stack, because the
  # alternative is what this check exists to prevent: CREATE_COMPLETE on all
  # resources, every output populated, and a Lambda that raises
  # ImportModuleError on every scheduled run forever. The common cause is
  # uploading GitHub's auto-generated "Source code (zip)" asset, which nests
  # the tree under <repo>-<version>/ so src.lambda_handler is unimportable,
  # instead of the release's package-<version>.zip.
  #
  # A zip that cannot be read is a warning, and the stack proceeds. The role
  # holds no kms:Decrypt (there is no parameter naming the code bucket's key),
  # so an SSE-KMS code bucket, a restrictive bucket policy, or a cross-account
  # code bucket all yield AccessDenied here. Failing closed on those would turn
  # this guard into a deploy blocker for configurations that work fine, so the
  # rule is: fail on proven wrong, skip on cannot determine.
  #
  # This is a misconfiguration guard, not an integrity control. It shows the
  # package is shaped like this Solution's, not that it is authentic. Anyone
  # who can write to the code bucket can satisfy it. Authenticity remains the
  # published .sha256 and the verification step in deploy/README.md.
  #
  # Object contents are never logged or returned in the response Data, which
  # is visible in stack events; only the marker verdict and, at most, a single
  # shared top-level prefix are reported.
  CodeLocationParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CodeLocationParserRole.Arn
      Timeout: 30
      # Holds the raw zip in memory to read its central directory. 512 MiB
      # gives headroom over the MAX_BYTES read ceiling below; the default
      # 128 MiB would not. Runs only during stack create/update.
      MemorySize: 512
      Architectures: [arm64]
      Code:
        ZipFile: |
          import io
          import zipfile
          from urllib.parse import urlparse

          import boto3
          import cfnresponse  # auto-provided for inline ZipFile Lambdas; do not bundle

          MARKER = "src/lambda_handler.py"
          MAX_BYTES = 67108864  # bound the in-memory read; a real package is ~200 KiB


          def describe(names):
              tops = {n.split("/")[0] for n in names if n.strip("/")}
              if len(tops) == 1:
                  return (
                      "every entry is nested under '%s/'. That is GitHub's auto-generated"
                      " 'Source code' archive, not the release's package-<version>.zip."
                      % tops.pop()
                  )
              return "it has no %s at its root." % MARKER


          def find_problem(bucket, key):
              """Describe why the zip is unusable, or return None if it is fine.

              Raises on failure to read the object, which the caller treats as
              'cannot determine' rather than as a problem with the package.
              """
              s3 = boto3.client("s3")
              if s3.head_object(Bucket=bucket, Key=key)["ContentLength"] > MAX_BYTES:
                  return None
              body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
              try:
                  names = zipfile.ZipFile(io.BytesIO(body)).namelist()
              except zipfile.BadZipFile:
                  return "it is not a valid zip archive."
              return None if MARKER in names else describe(names)


          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physicalResourceId="codeloc")
                      return
                  loc = event["ResourceProperties"]["CodeLocation"]
                  parts = urlparse(loc)
                  bucket = parts.netloc
                  key = parts.path.lstrip("/")
                  if parts.scheme != "s3" or not bucket or not key:
                      raise Exception("CodeLocation must be s3://bucket/key, got: " + loc)
                  try:
                      problem = find_problem(bucket, key)
                  except Exception as exc:
                      print("WARN cannot read %s, skipping layout check: %s" % (loc, exc))
                      problem = None
                  if problem:
                      raise Exception(
                          "%s is not a usable Lambda code package: %s Download"
                          " package-<version>.zip from the project's Releases page and"
                          " upload that instead." % (loc, problem)
                      )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {"Bucket": bucket, "Key": key}, physicalResourceId="codeloc")
              except Exception as exc:  # signal failure so the stack fails fast
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, physicalResourceId="codeloc", reason=str(exc)[:900])
                  raise

  # Log group for CodeLocationParserFunction.
  CodeLocationParserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CodeLocationParserFunction}"
      RetentionInDays: 90

  ExecuteCodeLocationParser:
    Type: Custom::CodeLocationParser
    DependsOn: CodeLocationParserLogGroup
    Properties:
      ServiceToken: !GetAtt CodeLocationParserFunction.Arn
      CodeLocation: !Ref CodeLocation

  # Lambda Function
  ReplicationLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: src.lambda_handler.handler
      Role: !GetAtt ExecutionRole.Arn
      Timeout: !Ref LambdaTimeoutSeconds
      MemorySize: !Ref LambdaMemoryMB
      Architectures: [arm64]
      # Never run two invocations of this function concurrently. Each
      # invocation processes every configured bucket sequentially (no
      # in-process concurrency), so there is no throughput reason to allow
      # more than one — and preventing a second invocation from starting at
      # all is a stronger guarantee than relying solely on the per-bucket
      # lease's conditional write to arbitrate a genuine overlap (e.g. a
      # run that is still in flight when the next ScheduleExpression trigger
      # fires). A throttled EventBridge Scheduler invocation is retried by
      # Scheduler itself, so this does not cause missed runs in normal
      # operation — see code-review-remediation verification-notes.md,
      # "concurrent-lease-contention" section.
      ReservedConcurrentExecutions: 1
      Code:
        # bucket/key are parsed from CodeLocation by the CodeLocationParser
        # custom resource (robust for keys with prefixes).
        S3Bucket: !GetAtt ExecuteCodeLocationParser.Bucket
        S3Key: !GetAtt ExecuteCodeLocationParser.Key
      VpcConfig: !If
        - HasVpc
        - SubnetIds: !Ref SubnetIds
          SecurityGroupIds: !Ref SecurityGroupIds
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          STATE_BUCKET: !Ref StateBucket
          ATHENA_WORKGROUP: !Ref AthenaWorkGroup
          ATHENA_OUTPUT_LOCATION: !Sub "s3://${StateBucket}/athena-results/"
          ACCOUNT_ID: !Ref AWS::AccountId
          BATCH_OPERATIONS_ROLE_ARN: !GetAtt BatchOperationsRole.Arn
          SOLUTION_CONFIG_KEY: config/solution-config.json
          KMS_KEY_ARN: !If [HasKmsKey, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
          JOURNAL_LOOKBACK_SECONDS: !Ref JournalLookbackSeconds
          METRICS_NAMESPACE: !If [HasMetricsNamespace, !Ref MetricsNamespace, !Ref "AWS::NoValue"]
          METRICS_DEPLOYMENT_ID: !If [HasMetricsDeploymentId, !Ref MetricsDeploymentId, !Ref "AWS::NoValue"]
          JOURNAL_READ_ROW_CAP: !Ref JournalReadRowCap
          REINVOCATION_CHAIN_LIMIT: !Ref ReinvocationChainLimit
          MAX_BATCH_JOB_FAILURES: !Ref MaxBatchJobFailures
          MAX_CONCURRENT_JOBS_PER_BUCKET: !Ref MaxConcurrentJobsPerBucket
          COMPLETION_REPORT_TOPIC_ARN: !If [HasCompletionNotificationEmail, !Ref CompletionReportTopic, !Ref "AWS::NoValue"]
          BATCH_JOB_FAILURE_TOPIC_ARN: !If [HasAlarmEmail, !Ref BatchJobFailureTopic, !Ref "AWS::NoValue"]
          BATCH_JOB_FAILURE_LOG_GROUP: !Ref BatchJobFailureLogGroup

  # Self-reinvocation permission (Requirements 4.1, 5.1) — unconditional, since
  # Self_Reinvocation is always available regardless of any other optional
  # feature being configured. Declared as a standalone AWS::IAM::Policy (not
  # part of ExecutionRole's own inline Policies list) because ReplicationLambda
  # depends on ExecutionRole (via its Role property); a statement inside
  # ExecutionRole's inline policy referencing !GetAtt ReplicationLambda.Arn
  # would create a circular dependency (ExecutionRole -> ReplicationLambda ->
  # ExecutionRole). A separate resource can depend on both without either of
  # them depending on each other, mirroring the MetricsPolicy /
  # BatchJobFailureLogWritePolicy pattern used elsewhere in this template.
  ReinvocationSelfInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ReinvocationSelfInvokeAccess
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SelfInvokeForReinvocation
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt ReplicationLambda.Arn

  # Log group for ReplicationLambda (main function). The scheduler invokes this
  # after deployment, so the log group will exist before first invocation.
  ReplicationLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReplicationLambda}"
      RetentionInDays: 90

  # Disables async-invoke function-error retries for the self-reinvocation
  # (design.md "Self-invoke async retry is disabled" decision): a
  # function-error retry would re-run a crashed reinvocation up to two more
  # times, duplicating a run and confusing Reinvocation_Chain depth
  # accounting. The scheduled EventBridge trigger remains the fallback, so a
  # dropped reinvocation is self-healing without retries. This does not
  # affect the throttling re-queue that lets the async event wait for the
  # ReservedConcurrentExecutions = 1 slot to free — that is the mechanism
  # Self_Reinvocation relies on. No DestinationConfig/DLQ is configured (not
  # required, per the resolved decision), and MaximumEventAgeInSeconds is
  # left at its default.
  ReplicationLambdaEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ReplicationLambda
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 0

  # Schedule Role
  # Also invokes CompletionReportCheckLambda when HasCompletionNotificationEmail.
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ReplicationLambda.Arn
                  - !If
                    - HasCompletionNotificationEmail
                    - !GetAtt CompletionReportCheckLambda.Arn
                    - !Ref "AWS::NoValue"

  # EventBridge Scheduler Schedule
  ReplicationSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: !Sub "rate(${CheckFrequencyMinutes} minutes)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReplicationLambda.Arn
        RoleArn: !GetAtt ScheduleRole.Arn

  # Completion Report Check Lambda / Schedule (conditional)
  # Report-missing detection runs on its own 5-minute schedule when
  # CompletionNotificationEmail is set.
  CompletionReportCheckLambda:
    Type: AWS::Lambda::Function
    Condition: HasCompletionNotificationEmail
    Properties:
      Runtime: python3.12
      Handler: src.lambda_handler.check_report_handler
      Role: !GetAtt ExecutionRole.Arn
      Timeout: 60
      MemorySize: !Ref CompletionCheckMemoryMB
      Architectures: [arm64]
      Code:
        S3Bucket: !GetAtt ExecuteCodeLocationParser.Bucket
        S3Key: !GetAtt ExecuteCodeLocationParser.Key
      VpcConfig: !If
        - HasVpc
        - SubnetIds: !Ref SubnetIds
          SecurityGroupIds: !Ref SecurityGroupIds
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          STATE_BUCKET: !Ref StateBucket
          ACCOUNT_ID: !Ref AWS::AccountId
          BATCH_OPERATIONS_ROLE_ARN: !GetAtt BatchOperationsRole.Arn
          SOLUTION_CONFIG_KEY: config/solution-config.json
          # This handler writes the same state objects as ReplicationLambda, so
          # it needs the same key or its writes downgrade them to SSE-S3.
          KMS_KEY_ARN: !If [HasKmsKey, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
          BATCH_JOB_FAILURE_TOPIC_ARN: !If [HasAlarmEmail, !Ref BatchJobFailureTopic, !Ref "AWS::NoValue"]
          BATCH_JOB_FAILURE_LOG_GROUP: !Ref BatchJobFailureLogGroup

  CompletionReportCheckLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasCompletionNotificationEmail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CompletionReportCheckLambda}"
      RetentionInDays: 90

  CompletionReportCheckSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasCompletionNotificationEmail
    Properties:
      ScheduleExpression: "rate(5 minutes)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt CompletionReportCheckLambda.Arn
        RoleArn: !GetAtt ScheduleRole.Arn

  # Batch job failure monitoring: captures S3 Batch Operations job status
  # changes via CloudTrail (requires an active trail, see deploy/README.md).
  # SNS topic/subscription conditional on AlarmEmail.
  BatchJobFailureLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/s3-replicate-on-tag/${AWS::StackName}/batch-job-failures"
      RetentionInDays: 90

  # Resource policy granting EventBridge permission to write to the log group.
  BatchJobFailureResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-BatchJobFailureLogDelivery"
      PolicyDocument: !Sub >-
        {"Version":"2012-10-17","Statement":[{"Sid":"EventBridgeLogDelivery",
        "Effect":"Allow","Principal":{"Service":"events.amazonaws.com"},
        "Action":["logs:CreateLogStream","logs:PutLogEvents"],
        "Resource":"${BatchJobFailureLogGroup.Arn}:*"}]}

  # SNS topic for email notifications (conditional on AlarmEmail).
  BatchJobFailureTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      KmsMasterKeyId: !If [HasSnsKmsKey, !Ref SnsKmsKeyArn, !Ref "AWS::NoValue"]

  BatchJobFailureSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref BatchJobFailureTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # EventBridge rule: S3 Batch Operations job status → Failed or Cancelled.
  # Targets the log group always (raw event, for full detail/debugging);
  # a notifier Lambda when AlarmEmail is set, which calls sns:Publish with
  # a meaningful subject line so the email is identifiable without opening it.
  BatchJobFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Description: >-
        Captures S3 Batch Operations job status changes to Failed or Cancelled
        via CloudTrail and delivers them to a CloudWatch log group (and
        optionally to a Lambda that publishes a readable email notification
        with a meaningful subject line).
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "AWS Service Event via CloudTrail"
        detail:
          eventName:
            - JobStatusChanged
          serviceEventDetails:
            status:
              - Failed
              - Cancelled
      State: ENABLED
      Targets:
        - Id: BatchJobFailureLogTarget
          Arn: !GetAtt BatchJobFailureLogGroup.Arn
        - !If
          - HasAlarmEmail
          - Id: BatchJobFailureLambdaTarget
            Arn: !GetAtt BatchJobFailureNotifierFunction.Arn
          - !Ref "AWS::NoValue"

  # Permission for EventBridge to invoke the notifier Lambda.
  BatchJobFailureNotifierPermission:
    Type: AWS::Lambda::Permission
    Condition: HasAlarmEmail
    Properties:
      FunctionName: !Ref BatchJobFailureNotifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BatchJobFailureRule.Arn

  # Inline Lambda that receives the EventBridge event and publishes to SNS
  # with a subject line that identifies the stack and bucket in the inbox
  # without opening the email. EventBridge's direct-to-SNS target does not
  # support a Subject field, which made every failure email arrive as
  # "A replication job did not finish successfully..." — unidentifiable in
  # an inbox with multiple stacks or buckets.
  BatchJobFailureNotifierFunction:
    Type: AWS::Lambda::Function
    Condition: HasAlarmEmail
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ExecutionRole.Arn
      Timeout: 30
      Architectures: [arm64]
      Environment:
        Variables:
          TOPIC_ARN: !Ref BatchJobFailureTopic
          STACK_NAME: !Ref AWS::StackName
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          sns = boto3.client("sns")

          def handler(event, context):
              topic_arn = os.environ["TOPIC_ARN"]
              stack_name = os.environ["STACK_NAME"]
              detail = event.get("detail", {}).get("serviceEventDetails", {})
              status = detail.get("status", "Unknown")
              job_id = detail.get("jobId", "unknown")
              region = event.get("region", "unknown")
              account = event.get("account", "unknown")

              subject = f"Batch job {status}: {stack_name} ({region})"
              # SNS subject max 100 chars
              if len(subject) > 100:
                  subject = subject[:97] + "..."

              message = (
                  f"An S3 Batch Operations replication job {status.lower()} "
                  f"in stack {stack_name} (account {account}, region {region}).\n\n"
                  f"Job ID: {job_id}\n"
                  f"See the job: https://{region}.console.aws.amazon.com/s3/jobs?region={region}\n\n"
                  f"What to do: open the job above to see which objects failed "
                  f"and why. The full event is in the {stack_name} "
                  f"BatchJobFailureLogGroup log group in CloudWatch Logs.\n\n"
                  f"If the job's failure reason is 'Reading the manifest is "
                  f"forbidden' then no objects were processed, and the cause is "
                  f"a permission gap rather than a replication problem. Batch "
                  f"Operations reads the manifest as the job's own IAM role, "
                  f"which this stack creates and grants s3:GetObject on the "
                  f"State_Bucket's manifests/ prefix. This reason therefore "
                  f"means that grant did not apply, which is a defect in the "
                  f"deployment rather than a condition in your account: "
                  f"compare the policy on the role named by the "
                  f"BatchOperationsRoleArn stack output against the Batch "
                  f"Operations job role table in docs/permissions.md. Nothing "
                  f"about a role you own is involved.\n\n"
                  f"The Solution retries automatically on its next run, so a "
                  f"single failure often needs no action. If the same bucket's "
                  f"jobs keep failing, it is paused automatically and you will "
                  f"receive a separate email explaining how to resume it."
              )

              sns.publish(TopicArn=topic_arn, Subject=subject, Message=message)
              return {"statusCode": 200}

  # Metric filter: every event delivered to the log group counts as one failure.
  BatchJobFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BatchJobFailureLogGroup
      FilterPattern: ""
      MetricTransformations:
        - MetricName: FailedBatchJobs
          MetricNamespace: !Sub "${AWS::StackName}/BatchJobs"
          MetricValue: "1"
          DefaultValue: 0

  # Alarm: fires when sum of FailedBatchJobs > 0 in a 5-minute window.
  # Console/dashboard visibility only — no AlarmActions (no SNS) here.
  # BatchJobFailureRule's own SNS target (via its InputTransformer) is the
  # actual email notification for this same underlying event; giving the
  # alarm its own AlarmActions would send a second, less readable email
  # (CloudWatch's generic "Threshold Crossed: 1 datapoint..." format, with
  # no job ID or bucket name) for every failure the rule already covers.
  BatchJobFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub >-
        S3 Batch Operations job failed or cancelled in stack ${AWS::StackName}.
        See the BatchJobFailureLogGroup CloudWatch Logs log group for the
        full event, or the email notification (if AlarmEmail is configured)
        for a summary with the job ID and a console link.
      MetricName: FailedBatchJobs
      Namespace: !Sub "${AWS::StackName}/BatchJobs"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Alarm: ReplicationLambda itself failed to complete a run.
  #
  # Distinct from BatchJobFailureAlarm above, which reports a batch job that
  # failed after a run submitted it successfully. This one covers the run never
  # working at all: an unhandled exception, a timeout, or an init failure such
  # as Runtime.ImportModuleError from a code package with the wrong layout.
  # Nothing else in the stack observes that. Without this alarm the Solution can
  # fail on every scheduled invocation indefinitely while every resource reports
  # healthy, which is only visible by opening CloudWatch Logs.
  #
  # Uses the native AWS/Lambda Errors metric rather than a log metric filter,
  # because an init failure never reaches the Solution's own logging: the module
  # does not import, so no structured entry is ever emitted. Errors counts it.
  #
  # Unlike BatchJobFailureAlarm this alarm does set AlarmActions. That alarm is
  # visibility-only because BatchJobFailureRule already emails a more readable
  # version of the same event. There is no equivalent path for a Lambda failure,
  # so leaving the actions off would reproduce the gap being closed here.
  #
  # TreatMissingData is missing, not notBreaching. With the period matching
  # CheckFrequencyMinutes each period carries exactly one datapoint, so
  # missing periods only occur when the schedule genuinely skips (throttle,
  # scheduler delay). Retaining state across those rare gaps gives one
  # notification when runs start failing and one when they recover.
  #
  # Throttles are deliberately not alarmed on: ReservedConcurrentExecutions is 1
  # by design, so a throttle means a scheduled trigger arrived while the
  # previous run was still going, which the next trigger resolves.
  ReplicationLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub >-
        ReplicationLambda failed to complete a run in stack ${AWS::StackName}.
        No tagging activity is being processed while this persists. Check the
        function's CloudWatch Logs log group for the failure. A
        Runtime.ImportModuleError means the CodeLocation zip has the wrong
        layout: it must contain src/lambda_handler.py at its root, which the
        release's package-<version>.zip provides and the auto-generated Source
        code archive does not.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReplicationLambda
      Statistic: Sum
      # Period matches CheckFrequencyMinutes so every period carries exactly
      # one invocation's datapoint. A shorter period (e.g. 300s with a
      # 15-minute schedule) leaves two empty periods per cycle; after a few
      # cycles CloudWatch transitions to INSUFFICIENT_DATA, and the next
      # datapoint transitions back to OK, emitting a spurious OKActions
      # email on every cycle.
      Period: !GetAtt SolutionConfig.CheckFrequencySeconds
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: !If
        - HasAlarmEmail
        - [!Ref BatchJobFailureTopic]
        - !Ref "AWS::NoValue"
      # Recovery is worth an email for an alarm that means nothing is being
      # replicated, and TreatMissingData: missing keeps it to one.
      OKActions: !If
        - HasAlarmEmail
        - [!Ref BatchJobFailureTopic]
        - !Ref "AWS::NoValue"

# Outputs
Outputs:
  StateBucketName:
    Description: Name of the State_Bucket (CloudFormation-generated).
    Value: !Ref StateBucket

  SolutionConfigUri:
    Description: S3 URI of the Solution_Config object.
    Value: !Sub "s3://${StateBucket}/config/solution-config.json"

  AthenaWorkGroupName:
    Description: Athena workgroup used for journal queries.
    Value: !Ref AthenaWorkGroup

  ReplicationLambdaName:
    Description: Name of the replication Lambda function.
    Value: !Ref ReplicationLambda

  ExecutionRoleArn:
    Description: ARN of the Lambda execution role.
    Value: !GetAtt ExecutionRole.Arn

  BatchOperationsRoleArn:
    Description: >-
      ARN of the S3 Batch Operations job role this stack creates and passes as
      each job's RoleArn. Name this principal in a customer-managed KMS key
      policy when one is used (see docs/kms.md).
    Value: !GetAtt BatchOperationsRole.Arn

  BatchJobFailureAlarmArn:
    Description: >-
      ARN of the CloudWatch alarm for S3 Batch Operations job failures.
      The alarm fires when a Failed or Cancelled job event is detected in a
      5-minute window.
    Value: !GetAtt BatchJobFailureAlarm.Arn

  ReplicationLambdaErrorAlarmArn:
    Description: >-
      ARN of the CloudWatch alarm for ReplicationLambda run failures. The alarm
      fires when the function records an invocation error, meaning a scheduled
      run did not complete and no tagging activity was processed. Notifies the
      AlarmEmail address when one is set.
    Value: !GetAtt ReplicationLambdaErrorAlarm.Arn
